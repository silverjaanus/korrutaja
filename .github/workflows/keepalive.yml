# Hoiab Supabase'i tasuta projekti ärkvel: tasuta projekt pausitakse, kui 7 päeva pole päringuid
# (nt suvevaheaeg). Üks kahjutu päring päevas hoiab selle ära.
# Asukoht repos: .github/workflows/keepalive.yml
name: keepalive
on:
  schedule:
    - cron: "17 6 * * *"   # iga päev 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC
        run: |
          curl -sS -m 30 -o /dev/null -w "%{http_code}\n" \
            -X POST "https://cidkhkxivrntfukadzip.supabase.co/rest/v1/rpc/class_board" \
            -H "apikey: sb_publishable_IGAE4XILD6QWg5qDCVszsA_JaHNgXF9" \
            -H "Content-Type: application/json" \
            -d '{"p_player_id":"00000000-0000-0000-0000-000000000000","p_secret":"keepalive"}'
