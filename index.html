<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korrutaja kolis Harjutaja alla</title>
<meta name="description" content="Korrutaja on nüüd Harjutaja sees.">
<link rel="canonical" href="https://harjutaja.silverjaanus.com/korrutaja/">
<link rel="icon" href="https://harjutaja.silverjaanus.com/icons/harjutaja-ikoon-ummar.svg" type="image/svg+xml">
<style>
:root{--paper:#fdfdfa;--ink:#1d2f4f;--ink2:#5a6a82;--edge:#c3d4ea;--card:#fff;
  --sun:#f3c445;--sun-edge:#e9b93f;--sun-ink:#3a2c00;--ok:#1d7f53;--ok-bg:#e3f5ec;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;
  padding:32px 16px 56px}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mark{width:72px;height:72px;border-radius:22.5%;display:block;margin:0 auto}
h1{font-size:27px;line-height:1.15;margin:0;text-align:center;font-weight:800}
p{margin:0}
.lead{color:var(--ink2);text-align:center}
.card{background:var(--card);border:1.5px solid var(--edge);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:800}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--ink2)}
dd{margin:0;font-weight:700;text-align:right}
a.btn{font:inherit;font-weight:800;border-radius:12px;padding:13px 18px;border:1.5px solid var(--edge);
  background:var(--card);color:var(--ink);text-align:center;text-decoration:none;display:block;width:100%}
a.btn.go{background:var(--sun);border-color:var(--sun-edge);color:var(--sun-ink);font-size:18px}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.note{font-size:14px;color:var(--ink2)}
.msg{border-radius:12px;padding:12px 14px;font-weight:700;background:var(--ok-bg);color:var(--ok)}
.foot{text-align:center;font-size:14px;color:var(--ink2);margin-top:6px}
.foot a{color:var(--ink2)}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Harjutaja">
    <rect width="100" height="100" rx="22.5" fill="#f3c445"/>
    <path d="M28 24V76M38 24V76M62 24V76M72 24V76" fill="none" stroke="#16284a" stroke-width="8.6" stroke-linecap="round"/>
    <path d="M38 56L62 44" fill="none" stroke="#16284a" stroke-width="8.6" stroke-linecap="round"/>
  </svg>

  <h1>Korrutaja kolis Harjutaja alla</h1>
  <p class="lead">Korrutaja on nüüd Harjutaja sees, koos teiste õppemängudega. Siin, vanal aadressil, teda enam ei ole.</p>

  <div id="app"></div>

  <p class="foot">Tegi <a href="https://silverjaanus.com" target="_blank" rel="noopener">Silver Jaanus</a></p>
</main>

<script>
(function () {
  var KEY = 'korrutaja_v1';
  var VIIDUD = 'korrutaja_viidud';
  var UUS = 'https://harjutaja.silverjaanus.com/korrutaja/';
  var app = document.getElementById('app');

  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  var raw = null, viidud = false;
  try { raw = localStorage.getItem(KEY); viidud = !!localStorage.getItem(VIIDUD); } catch (e) {}

  var D = null;
  if (raw) { try { D = JSON.parse(raw); } catch (e) { D = null; } }

  function nupp(go) { return el('<a class="btn' + (go ? ' go' : '') + '" href="' + UUS + '">Ava uus Korrutaja</a>'); }
  function vii(go) { return el('<a class="btn' + (go ? ' go' : '') + '" href="vii-ule.html">Vii edenemine üle</a>'); }

  if (!D) {
    app.append(nupp(true));
    app.append(el('<p class="note">Selles brauseris ei ole Korrutaja edenemist, nii et kaasa võtta pole midagi. Uues kohas saad kohe harjutama hakata.</p>'));
    return;
  }

  var paevi = D.days ? Object.keys(D.days).length : 0;
  var vastuseid = (D.total && D.total.n) || 0;
  var voistlusi = (D.tests && D.tests.length) || 0;
  var cls = D.cls;

  var rows = '<dl>'
    + '<dt>Harjutatud päevi</dt><dd>' + paevi + '</dd>'
    + '<dt>Vastuseid kokku</dt><dd>' + vastuseid + '</dd>'
    + '<dt>Võistlusi</dt><dd>' + voistlusi + '</dd>'
    + (cls ? '<dt>Klass</dt><dd>' + esc(cls.class_name || cls.code || '—') + '</dd>' : '')
    + '</dl>';

  if (viidud) {
    app.append(el('<div class="msg">Sinu edenemine on juba üle viidud.</div>'));
    app.append(nupp(true));
    app.append(el('<div class="card"><h2>Mis siia jäi</h2>' + rows
      + '<p class="note">See koopia jääb siia seisma ja vananeb. Päris harjutamine käib nüüd uues kohas.</p></div>'));
    app.append(vii(false));
    return;
  }

  app.append(el('<div class="card"><h2>Sinu edenemine on veel siin</h2>' + rows
    + '<p class="note">See ei lähe ise kaasa. Vajuta nuppu, siis on kõik uues kohas alles.</p></div>'));
  app.append(vii(true));
  app.append(nupp(false));
})();
</script>
</body>
</html>
